server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      # NOTE ON SCOPE: routes below use static URIs resolved via Docker
      # Compose / Kubernetes Service DNS names rather than Eureka service
      # discovery. This keeps the gateway functional without standing up a
      # separate Eureka server module. To add real service discovery, add a
      # spring-cloud-starter-netflix-eureka-server module, register each
      # service with spring-cloud-starter-netflix-eureka-client, and switch
      # these URIs to `lb://user-service` etc. with
      # spring.cloud.gateway.discovery.locator.enabled: true.
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 250000
                redis-rate-limiter.burstCapacity: 300000
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimiterKeyResolver}"

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 250000
                redis-rate-limiter.burstCapacity: 300000
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimiterKeyResolver}"
            - name: CircuitBreaker
              args:
                name: inventoryServiceCB
                fallbackUri: forward:/fallback/inventory

        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 250000
                redis-rate-limiter.burstCapacity: 300000
                key-resolver: "#{@rateLimiterKeyResolver}"

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**,/api/v1/cart/**,/api/v1/bulk-orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 250000
                redis-rate-limiter.burstCapacity: 300000
                key-resolver: "#{@rateLimiterKeyResolver}"

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**

jwt:
  secret: ${JWT_SECRET:change-this-dev-only-secret-min-32-bytes-long!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.platform.ecommerce: INFO
    org.springframework.cloud.gateway: INFO

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.platform.ecommerce: WARN

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.platform.ecommerce: DEBUG
    org.springframework.cloud.gateway: DEBUG
