server:
  port: 8085

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: false  # inventory-service owns migrations

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false

jwt:
  secret: ${JWT_SECRET:change-this-dev-only-secret-min-32-bytes-long!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.platform.ecommerce: INFO
    org.springframework.kafka: WARN

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.platform.ecommerce: WARN

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.platform.ecommerce: DEBUG
