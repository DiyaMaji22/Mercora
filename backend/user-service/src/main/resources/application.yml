server:
  port: 8081

spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Inventory Service owns and applies the shared schema migrations (V1-V3)
  # at startup. Other services only validate against that schema to avoid
  # two services racing to write the same flyway_schema_history table.
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:change-this-dev-only-secret-min-32-bytes-long!}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.platform.ecommerce: INFO

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.platform.ecommerce: WARN

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.platform.ecommerce: DEBUG
