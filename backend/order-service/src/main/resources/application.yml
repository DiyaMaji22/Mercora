server:
  port: 8084

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: false  # inventory-service owns migrations; see its application.yml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

services:
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}

jwt:
  secret: ${JWT_SECRET:change-this-dev-only-secret-min-32-bytes-long!}

resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      inventoryService:
        max-attempts: 3
        wait-duration: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.platform.ecommerce: INFO

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    com.platform.ecommerce: WARN

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.platform.ecommerce: DEBUG
