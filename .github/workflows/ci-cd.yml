name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/ecommerce

jobs:
  # ---------- BACKEND: build + test each Java microservice ----------
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - inventory-service
          - product-service
          - order-service
          - payment-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test ${{ matrix.service }}
        working-directory: backend
        run: mvn -B -pl ${{ matrix.service }} -am test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/

  # ---------- FRONTEND: lint + build + type-check ----------
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------- AI SERVICE: pytest ----------
  ai-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ai-service
        run: pytest tests/ -v

  # ---------- BUILD & PUSH IMAGES (main branch only) ----------
  build-and-push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-test, frontend-test, ai-service-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            context: backend
            dockerfile: backend/api-gateway/Dockerfile
          - service: user-service
            context: backend
            dockerfile: backend/user-service/Dockerfile
          - service: inventory-service
            context: backend
            dockerfile: backend/inventory-service/Dockerfile
          - service: product-service
            context: backend
            dockerfile: backend/product-service/Dockerfile
          - service: order-service
            context: backend
            dockerfile: backend/order-service/Dockerfile
          - service: payment-service
            context: backend
            dockerfile: backend/payment-service/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - service: ai-service
            context: ai-service
            dockerfile: ai-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- DEPLOY: dev (auto), staging (auto), prod (manual approval) ----------
  deploy-dev:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: [backend-test, frontend-test, ai-service-test]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to dev cluster
        run: |
          echo "kubectl apply -f devops/k8s/base --namespace ecommerce-dev"
          echo "(configure kubeconfig via a cloud-provider action + secrets before enabling this for real)"

  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging cluster
        run: |
          echo "kubectl apply -f devops/k8s/base --namespace ecommerce-staging"

  deploy-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production   # requires manual approval via GitHub Environments protection rules
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production cluster
        run: |
          echo "kubectl apply -f devops/k8s/base --namespace ecommerce"
