version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
    - 5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ecommerce
      interval: 5s
      timeout: 5s
      retries: 10
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ecommerce-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_NAME: ecommerce
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '1000'
      DEFAULT_POOL_SIZE: '80'
      AUTH_TYPE: scram-sha-256
    ports:
    - 5433:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h localhost -p 5432 -U ecommerce || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
    - 2181:2181
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ecommerce-kafka
    depends_on:
    - zookeeper
    ports:
    - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
      - CMD
      - kafka-topics
      - --bootstrap-server
      - localhost:9092
      - --list
      interval: 10s
      timeout: 10s
      retries: 10
  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: ecommerce-user-service
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
    - 8081:8081
    environment:
      DB_URL: jdbc:postgresql://pgbouncer:5432/ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-min-32-bytes-long!}
      SPRING_PROFILES_ACTIVE: dev
    develop:
      watch:
      - action: rebuild
        path: ./backend/user-service/src
      - action: rebuild
        path: ./backend/user-service/pom.xml
  inventory-service:
    build:
      context: ./backend
      dockerfile: inventory-service/Dockerfile
    container_name: ecommerce-inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
    - 8082:8082
    environment:
      DB_URL: jdbc:postgresql://pgbouncer:5432/ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-min-32-bytes-long!}
      SPRING_PROFILES_ACTIVE: dev
    develop:
      watch:
      - action: rebuild
        path: ./backend/inventory-service/src
      - action: rebuild
        path: ./backend/inventory-service/pom.xml
  order-service:
    build:
      context: ./backend
      dockerfile: order-service/Dockerfile
    container_name: ecommerce-order-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_started
      pgbouncer:
        condition: service_healthy
    ports:
    - 8084:8084
    environment:
      DB_URL: jdbc:postgresql://pgbouncer:5432/ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-min-32-bytes-long!}
      SPRING_PROFILES_ACTIVE: dev
    develop:
      watch:
      - action: rebuild
        path: ./backend/order-service/src
      - action: rebuild
        path: ./backend/order-service/pom.xml
  product-service:
    build:
      context: ./backend
      dockerfile: product-service/Dockerfile
    container_name: ecommerce-product-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
    - 8083:8083
    environment:
      DB_URL: jdbc:postgresql://pgbouncer:5432/ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-min-32-bytes-long!}
      SPRING_PROFILES_ACTIVE: dev
    develop:
      watch:
      - action: rebuild
        path: ./backend/product-service/src
      - action: rebuild
        path: ./backend/product-service/pom.xml
  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: ecommerce-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    ports:
    - 8085:8085
    environment:
      DB_URL: jdbc:postgresql://pgbouncer:5432/ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-min-32-bytes-long!}
      SPRING_PROFILES_ACTIVE: dev
    develop:
      watch:
      - action: rebuild
        path: ./backend/payment-service/src
      - action: rebuild
        path: ./backend/payment-service/pom.xml
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce-api-gateway
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      inventory-service:
        condition: service_started
      order-service:
        condition: service_started
      product-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
    - 8080:8080
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-min-32-bytes-long!}
      SPRING_PROFILES_ACTIVE: dev
    develop:
      watch:
      - action: rebuild
        path: ./backend/api-gateway/src
      - action: rebuild
        path: ./backend/api-gateway/pom.xml
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ecommerce-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
    - 9200:9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:9200/_cluster/health | grep -q '"status"'
      interval: 10s
      timeout: 10s
      retries: 10
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    depends_on:
    - api-gateway
    ports:
    - 3000:3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    develop:
      watch:
      - action: rebuild
        path: ./frontend/src
      - action: rebuild
        path: ./frontend/app
      - action: rebuild
        path: ./frontend/package.json
      - action: rebuild
        path: ./frontend/components
      - action: sync
        path: ./frontend/public
        target: /app/public
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ecommerce-ai-service
    ports:
    - 8000:8000
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8083
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ecommerce-prometheus
    volumes:
    - ./devops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 9090:9090
  grafana:
    image: grafana/grafana:11.0.0
    container_name: ecommerce-grafana
    depends_on:
    - prometheus
    ports:
    - 3001:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
    - grafana-data:/var/lib/grafana
  zipkin:
    image: openzipkin/zipkin:2.24
    container_name: ecommerce-zipkin
    ports:
    - 9411:9411
volumes:
  postgres-data: null
  grafana-data: null
