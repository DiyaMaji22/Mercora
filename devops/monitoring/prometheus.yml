global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "user-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: "inventory-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8082"]

  - job_name: "product-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service:8083"]

  - job_name: "order-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8084"]

  - job_name: "payment-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8085"]

  - job_name: "ai-service"
    metrics_path: /metrics   # requires adding prometheus-fastapi-instrumentator to enable
    static_configs:
      - targets: ["ai-service:8000"]

# In Kubernetes, prefer kubernetes_sd_configs with the
# prometheus.io/scrape annotations already set on each Deployment (see
# devops/k8s/base/*.yaml) instead of this static target list - this file is
# the docker-compose / local-dev equivalent.
