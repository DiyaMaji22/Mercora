# Secrets template. DO NOT commit real values - this file documents the
# expected keys. In practice, populate via `kubectl create secret` from a
# vault/CI secret store, or use Sealed Secrets / External Secrets Operator.
#
#   kubectl create secret generic ecommerce-secrets \
#     --namespace ecommerce \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=JWT_SECRET='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_MIN_32_BYTES"
